<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="900" height="180">
  <defs>
    <linearGradient id="cg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="50%" stop-color="#00ffcc"/>
      <stop offset="100%" stop-color="#00ffff"/>
    </linearGradient>
    <linearGradient id="mg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff00ff"/>
      <stop offset="50%" stop-color="#ff00cc"/>
      <stop offset="100%" stop-color="#8800ff"/>
    </linearGradient>
    <filter id="g1">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="g2">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="900" height="180" fill="#00000000"/>
  <text x="450" y="65" font-family="monospace" font-size="52" font-weight="bold" fill="url(#cg)" text-anchor="middle" filter="url(#g1)">AXI STRIKE</text>
  <text x="450" y="105" font-family="monospace" font-size="24" fill="url(#mg)" text-anchor="middle" filter="url(#g2)">CRYSTAL COSMOS BATTLE ARENA</text>
  <text x="450" y="140" font-family="monospace" font-size="13" fill="#00ffcc" text-anchor="middle" opacity="0.8">VERSION 3.7.1 ® CLEARANCE: OMEGA</text>
  <line x1="150" y1="155" x2="750" y2="155" stroke="#00ffcc" stroke-width="1" opacity="0.3">
    <animate attributeName="stroke-dasharray" values="0,600;600,0" dur="4s" repeatCount="indefinite"/>
  </line>
</svg>