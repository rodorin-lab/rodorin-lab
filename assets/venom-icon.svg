<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100" height="100">
  <defs>
    <linearGradient id="venomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#66ff66"/>
      <stop offset="50%" stop-color="#44ff44"/>
      <stop offset="100%" stop-color="#00aa00"/>
    </linearGradient>
    <filter id="venomGlow">
      <feGaussianBlur stdDeviation="3"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="codePattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <text x="2" y="10" font-size="8" fill="#00ff00" opacity="0.3" font-family="monospace">01</text>
    </pattern>
  </defs>

  <!-- 頭部 -->
  <polygon points="100,10 170,80 140,180 60,180 30,80" fill="url(#venomGrad)" stroke="#44ff44" stroke-width="2" filter="url(#venomGlow)">
    <animateTransform attributeName="transform" type="rotate" values="0 100 100;1 100 100;0 100 100;-1 100 100;0 100 100" dur="5s" repeatCount="indefinite"/>
  </polygon>

  <!-- コードパターン -->
  <polygon points="100,10 170,80 140,180 60,180 30,80" fill="url(#codePattern)" opacity="0.5"/>

  <!-- 目（ハッカー風） -->
  <rect x="70" y="60" width="25" height="15" rx="3" fill="#00ff00">
    <animate attributeName="width" values="25;20;25" dur="1s" repeatCount="indefinite"/>
  </rect>
  <rect x="105" y="60" width="25" height="15" rx="3" fill="#00ff00">
    <animate attributeName="width" values="25;20;25" dur="1s" begin="0.5s" repeatCount="indefinite"/>
  </rect>

  <!-- 触手 -->
  <path d="M 50 140 Q 20 160 30 190" stroke="#44ff44" stroke-width="2" fill="none">
    <animate attributeName="d" values="M 50 140 Q 20 160 30 190;M 50 140 Q 10 170 20 200;M 50 140 Q 20 160 30 190" dur="2s" repeatCount="indefinite"/>
  </path>
  <path d="M 150 140 Q 180 160 170 190" stroke="#44ff44" stroke-width="2" fill="none">
    <animate attributeName="d" values="M 150 140 Q 180 160 170 190;M 150 140 Q 190 170 180 200;M 150 140 Q 180 160 170 190" dur="2s" begin="0.3s" repeatCount="indefinite"/>
  </path>
</svg>