<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100" height="100">
  <defs>
    <linearGradient id="zexGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8844"/>
      <stop offset="50%" stop-color="#ff6633"/>
      <stop offset="100%" stop-color="#cc3300"/>
    </linearGradient>
    <filter id="zexGlow">
      <feGaussianBlur stdDeviation="3"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 重装甲GEAR -->
  <rect x="50" y="30" width="100" height="120" rx="10" fill="url(#zexGrad)" stroke="#ff6633" stroke-width="2" filter="url(#zexGlow)">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-3;0,0" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- キャノン -->
  <rect x="80" y="10" width="40" height="30" fill="#cc3300" stroke="#ff6633" stroke-width="2">
    <animate attributeName="height" values="30;35;30" dur="0.5s" repeatCount="indefinite"/>
  </rect>

  <!-- 目 -->
  <rect x="70" y="60" width="60" height="20" fill="#ffcc00">
    <animate attributeName="fill" values="#ffcc00;#ff4400;#ffcc00" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  <circle cx="85" cy="70" r="5" fill="#ffffff"/>
  <circle cx="115" cy="70" r="5" fill="#ffffff"/>

  <!-- 装甲パネル -->
  <line x1="50" y1="90" x2="150" y2="90" stroke="#ff4400" stroke-width="1" opacity="0.5"/>
  <line x1="50" y1="120" x2="150" y2="120" stroke="#ff4400" stroke-width="1" opacity="0.5"/>
</svg>